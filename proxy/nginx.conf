events {
    worker_connections 1024;
}

http {
    # WebSocket upgrade mapping (standard nginx pattern)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream rise_fall     { server rise-fall:3001; }
    upstream accumulators  { server accumulators:3002; }
    upstream digits        { server digits:3003; }
    upstream bot_builder   { server bot-builder:4003; }

    server {
        listen 80;
        client_max_body_size 50m;

        # ---- Landing page ----
        location = / {
            root /usr/share/nginx/html;
            index index.html;
        }
        location /assets/ {
            root /usr/share/nginx/html;
        }

        # ---- Rise/Fall (Next.js, basePath /rise-fall) ----
        location /rise-fall/ {
            proxy_pass http://rise_fall;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        # ---- Accumulators (Next.js, basePath /accumulators) ----
        location /accumulators/ {
            proxy_pass http://accumulators;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        # ---- Digits (Next.js, basePath /digits) ----
        location /digits/ {
            proxy_pass http://digits;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        # ---- Bot Builder (rsbuild, assetPrefix /bot-builder/) ----
        location /bot-builder/ {
            proxy_pass http://bot_builder;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }
    }
}
